[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blaxcy"
version = "0.3.1"
description = "Recoverable foreground device-control runtime with EYE, MOUSE, KEYBOARD and MCP connector."
requires-python = ">=3.10"
dependencies = [
  "mss>=9.0",
  "numpy>=1.26",
  "opencv-python>=4.9",
  "pyautogui>=0.9.54",
  "websockets>=12.0",
  "mcp>=2.0,<3",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13"]
windows = ["pywinauto>=0.6.9"]
linux = ["pyatspi>=2.46"]
macos = ["pyobjc-framework-Quartz>=11.0"]

[project.scripts]
blaxcy = "blaxcy.__main__:main"
blaxcy-mcp = "blaxcy.mcp_server:main"

[tool.setuptools.packages.find]
include = ["blaxcy*"]
