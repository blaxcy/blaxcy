[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blaxcy"
version = "0.2.0"
description = "Temporary foreground device connection with EYE, MOUSE and KEYBOARD."
requires-python = ">=3.10"
dependencies = [
  "mss>=9.0",
  "numpy>=1.26",
  "opencv-python>=4.9",
  "pyautogui>=0.9.54",
  "websockets>=12.0",
]

[project.scripts]
blaxcy = "blaxcy.__main__:main"

[tool.setuptools.packages.find]
include = ["blaxcy*"]
